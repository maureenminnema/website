
name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Hugo site
        run: |
          docker buildx build \
            --target site \
            --build-arg BASE_URL=https://maureenminnema.github.io/website/ \
            --output type=local,dest=./public \
            .

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
